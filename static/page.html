<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Rabitah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#0b0d12; --card:#181c26; --line:#262b38; --text:#f2f4f8; --muted:#9aa3b2; --accent:#7c5cff;
    }
    [data-theme="midnight"] { --bg:#0b0d12; --card:#181c26; --line:#262b38; --accent:#7c5cff; --text:#f2f4f8; }
    [data-theme="sunset"] { --bg:#1a0f14; --card:#2a1820; --line:#4a2a38; --accent:#ff7a59; --text:#ffe9e0; }
    [data-theme="forest"] { --bg:#0c1410; --card:#15241c; --line:#27402f; --accent:#3ecf8e; --text:#e8f5ee; }
    [data-theme="ocean"] { --bg:#0a1018; --card:#12202e; --line:#1f3a52; --accent:#5aa9ff; --text:#e8f1fa; }
    [data-theme="mono"] { --bg:#101010; --card:#1c1c1c; --line:#2e2e2e; --accent:#e8e8e8; --text:#f5f5f5; --muted:#8a8a8a; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    h1,h2 { font-family:'Space Grotesk',sans-serif; }
    .page { max-width:520px; margin:0 auto; padding:56px 24px 40px; width:100%; flex:1; }
    .avatar { width:84px; height:84px; border-radius:50%; margin:0 auto 16px; background:linear-gradient(135deg,var(--accent),transparent); display:flex; align-items:center; justify-content:center; font-size:36px; overflow:hidden; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .avatar .ph { font-size:36px; }
    .name { text-align:center; font-family:'Space Grotesk'; font-size:22px; font-weight:700; letter-spacing:-.3px; }
    .handle { text-align:center; color:var(--muted); font-size:13px; margin-top:4px; }
    .bio { text-align:center; color:var(--muted); font-size:14px; line-height:1.6; margin:16px 0 28px; max-width:420px; margin-left:auto; margin-right:auto; }
    .link { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; text-decoration:none; color:var(--text); transition:.2s; }
    .link:hover { transform:translateY(-2px); border-color:var(--accent); box-shadow:0 10px 30px rgba(0,0,0,.35); }
    .link .l-ic { width:38px; height:38px; border-radius:11px; background:color-mix(in srgb, var(--accent) 18%, transparent); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .link .l-title { font-weight:600; font-size:14.5px; flex:1; }
    .link .l-arrow { color:var(--muted); font-size:16px; }
    .footer { text-align:center; padding:20px; color:var(--muted); font-size:12px; }
    .footer a { color:var(--accent); text-decoration:none; }
    .empty { text-align:center; color:var(--muted); padding:40px 0; }
  </style>
</head>
<body data-theme="midnight">
  <div class="page">
    <div class="avatar" id="avatar"><span class="ph" id="avatar-ph">👤</span></div>
    <h1 class="name" id="p-name">—</h1>
    <div class="handle" id="p-handle">@—</div>
    <p class="bio" id="p-bio"></p>
    <div id="links"></div>
  </div>
  <div class="footer">Powered by <a href="/">rabitah</a> · your links, one smart page</div>
  <script>
    const username = location.pathname.split("/").filter(Boolean)[0] || "demo";
    async function load() {
      try {
        const res = await fetch("/api/page/" + username);
        if (!res.ok) throw new Error("not found");
        const p = await res.json();
        document.title = p.display_name + " | Rabitah";
        document.body.dataset.theme = p.theme;
        document.getElementById("p-name").textContent = p.display_name;
        document.getElementById("p-handle").textContent = "@" + p.username;
        document.getElementById("p-bio").textContent = p.bio || "";
        const av = document.getElementById("avatar");
        if (p.avatar_url) {
          av.innerHTML = '<img src="' + p.avatar_url + '" alt="avatar" />';
        } else {
          av.innerHTML = '<span class="ph">' + (p.display_name[0] || "?").toUpperCase() + "</span>";
        }
        const wrap = document.getElementById("links");
        if (!p.links.length) {
          wrap.innerHTML = '<div class="empty">No links yet — check back soon.</div>';
          return;
        }
        wrap.innerHTML = p.links.map(l =>
          '<a class="link" href="/go/' + l.id + '" target="_blank" rel="noopener">' +
          '<span class="l-ic">' + iconFor(l.icon) + "</span>" +
          '<span class="l-title">' + esc(l.title) + "</span>" +
          '<span class="l-arrow">↗</span></a>'
        ).join("");
      } catch (e) {
        document.getElementById("p-name").textContent = "Page not found";
        document.getElementById("p-bio").textContent = "This page doesn't exist — maybe the owner changed their username?";
      }
    }
    function iconFor(icon) {
      const map = { github:"🐙", youtube:"▶️", instagram:"📸", tiktok:"🎵", briefcase:"💼", video:"🎬", calendar:"📅", mail:"✉️", whatsapp:"💬" };
      return map[icon] || "🔗";
    }
    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    load();
  </script>
</body>
</html>
