[project]
name = "rabitah"
version = "1.0.0"
description = "Smart link-in-bio & micro-page builder for creators"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
